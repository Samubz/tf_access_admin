name: Deploy production

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-push-clean-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image metadata
        id: image
        run: |
          IMAGE_NAME_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          VERSION="${GITHUB_REF_NAME}"

          echo "name=${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"
          echo "package=$(basename "${IMAGE_NAME_LOWER}")" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }} \
            -t ${{ steps.image.outputs.name }}:production \
            .

      - name: Push Docker image
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          docker push ${{ steps.image.outputs.name }}:production

      - name: Keep only latest 2 GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.image.outputs.package }}
          package-type: container
          min-versions-to-keep: 2
          token: ${{ secrets.GHCR_DELETE_TOKEN }}

      - name: Trigger Dokploy deployment
        run: |
          curl -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -d '{
              "applicationId": "${{ secrets.DOKPLOY_APPLICATION_ID }}",
              "title": "Deploy ${{ steps.image.outputs.version }}",
              "description": "Deploy triggered by Git tag ${{ steps.image.outputs.version }}"
            }'